<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="oceanBgPure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020a1c" />
      <stop offset="50%" stop-color="#051633" />
      <stop offset="100%" stop-color="#08214d" />
    </linearGradient>

    <!-- Slick Gradient -->
    <radialGradient id="slickGlowPure" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2563eb" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#1e40af" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020a1c" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPure" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrowPure" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGoldPure" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Base Ocean Layer -->
  <rect width="800" height="500" fill="url(#oceanBgPure)" />
  <rect width="800" height="500" fill="url(#gridPure)" opacity="0.6" />

  <!-- Coastline Contour SVG Path (Right side shoreline) -->
  <path d="M 620 0 Q 640 100 680 180 T 730 320 T 780 500 L 800 500 L 800 0 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M 640 0 Q 660 100 700 180 T 750 320 T 800 480" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Bathymetric Iso-lines -->
  <path d="M 0 120 Q 250 160 500 100 T 800 150" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.5" />
  <path d="M 0 260 Q 300 290 550 240 T 800 300" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.5" />
  <path d="M 0 400 Q 280 430 520 380 T 800 440" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.5" />

  <!-- Hydrodynamic Ocean Current Flow Vectors (Arrows) -->
  <g opacity="0.6">
    <line x1="80" y1="100" x2="160" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowPure)" />
    <line x1="200" y1="110" x2="280" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowPure)" />
    <line x1="320" y1="130" x2="400" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowPure)" />
    
    <line x1="100" y1="240" x2="180" y2="270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowPure)" />
    <line x1="220" y1="260" x2="310" y2="290" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowPure)" />
    <line x1="340" y1="280" x2="440" y2="310" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowPure)" />
    <line x1="470" y1="300" x2="570" y2="330" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowPure)" />

    <line x1="120" y1="380" x2="200" y2="400" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowPure)" />
    <line x1="240" y1="400" x2="320" y2="420" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowPure)" />
  </g>

  <!-- Initial Oil Release Point (T=0) -->
  <circle cx="180" cy="180" r="16" fill="#0284c7" opacity="0.4" />
  <circle cx="180" cy="180" r="6" fill="#38bdf8" />

  <!-- Forecast Drift Expansion Envelopes -->
  <!-- 24 Hours Plume -->
  <path d="M 180 180 Q 270 210 320 240 Q 340 280 280 270 Q 220 230 180 180 Z" fill="url(#slickGlowPure)" />
  <path d="M 180 180 Q 270 210 320 240 Q 340 280 280 270 Q 220 230 180 180 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- 48 Hours Plume -->
  <path d="M 180 180 Q 360 250 440 290 Q 470 340 380 340 Q 260 290 180 180 Z" fill="#2563eb" opacity="0.25" />
  <path d="M 180 180 Q 360 250 440 290 Q 470 340 380 340 Q 260 290 180 180 Z" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- 72 Hours Shoreline Impact Plume -->
  <path d="M 180 180 Q 450 300 580 360 Q 640 400 520 420 Q 300 340 180 180 Z" fill="#dc2626" opacity="0.2" />
  <path d="M 180 180 Q 450 300 580 360 Q 640 400 520 420 Q 300 340 180 180 Z" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5,5" />

  <!-- Particle Drift Streamline -->
  <path d="M 180 180 C 280 220 400 270 590 365" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowGoldPure)" />

  <!-- Tactical Reticle Overlays -->
  <circle cx="590" cy="365" r="16" fill="none" stroke="#ef4444" stroke-width="2" />
  <circle cx="590" cy="365" r="24" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="590" y1="335" x2="590" y2="395" stroke="#ef4444" stroke-width="1" />
  <line x1="560" y1="365" x2="620" y2="365" stroke="#ef4444" stroke-width="1" />
</svg>
