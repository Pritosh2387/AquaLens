<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Deep Ocean Gradient -->
    <linearGradient id="fwdOceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02091a" />
      <stop offset="45%" stop-color="#051c3d" />
      <stop offset="85%" stop-color="#0a2e63" />
      <stop offset="100%" stop-color="#030c1d" />
    </linearGradient>

    <!-- Dispersion Plume Radiants -->
    <radialGradient id="plumeDispersion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#02091a" stop-opacity="0" />
    </radialGradient>

    <!-- Radar Grid Pattern -->
    <pattern id="reticleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d4ed8" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.35"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="currentArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="windArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="800" height="500" fill="url(#fwdOceanGrad)" />
  <rect width="800" height="500" fill="url(#reticleGrid)" />

  <!-- Latitude / Longitude Tactical Grid Markings -->
  <g fill="#64748b" font-family="monospace" font-size="9" opacity="0.7">
    <text x="15" y="100">18°58'N</text>
    <text x="15" y="240">18°55'N</text>
    <text x="15" y="380">18°52'N</text>

    <text x="160" y="490">72°48'E</text>
    <text x="360" y="490">72°52'E</text>
    <text x="560" y="490">72°56'E</text>
    <text x="720" y="490">73°00'E</text>
  </g>

  <!-- Bathymetric Iso-Depth Lines with Depth Labels -->
  <g fill="none" stroke="#1e40af" stroke-width="1.5" opacity="0.5">
    <path d="M 0 90 C 250 150 550 80 800 110" />
    <path d="M 0 220 C 300 280 500 190 800 240" />
    <path d="M 0 360 C 280 410 520 330 800 380" />
  </g>
  <text x="720" y="105" fill="#3b82f6" font-family="monospace" font-size="9" opacity="0.6">-20m Depth</text>
  <text x="720" y="235" fill="#3b82f6" font-family="monospace" font-size="9" opacity="0.6">-50m Depth</text>
  <text x="720" y="375" fill="#3b82f6" font-family="monospace" font-size="9" opacity="0.6">-100m Depth</text>

  <!-- Coastline Land Boundary (Right Edge) -->
  <path d="M 640 0 C 670 120 710 180 750 300 C 780 400 800 450 810 500 L 800 500 L 800 0 Z" fill="#0b1b36" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 650 0 C 680 120 720 180 760 300 C 790 400 810 450 820 500" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />
  <text x="720" y="40" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="bold">MUMBAI COASTLINE</text>

  <!-- Ocean Current Vector Arrows (Flow Streamlines) -->
  <g opacity="0.7">
    <line x1="80" y1="120" x2="180" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#currentArrow)" />
    <line x1="220" y1="130" x2="320" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#currentArrow)" />
    <line x1="360" y1="140" x2="460" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#currentArrow)" />

    <line x1="100" y1="260" x2="220" y2="290" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#currentArrow)" />
    <line x1="260" y1="280" x2="380" y2="310" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#currentArrow)" />
    <line x1="420" y1="300" x2="540" y2="330" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#currentArrow)" />

    <line x1="140" y1="400" x2="240" y2="420" stroke="#38bdf8" stroke-width="2" marker-end="url(#currentArrow)" />
    <line x1="280" y1="420" x2="380" y2="440" stroke="#38bdf8" stroke-width="2" marker-end="url(#currentArrow)" />
  </g>

  <!-- Wind Surface Vector Arrow (SW Wind @ 18 kts) -->
  <g transform="translate(100, 80)">
    <line x1="0" y1="40" x2="80" y2="0" stroke="#fbbf24" stroke-width="3" marker-end="url(#windArrow)" />
    <text x="40" y="-8" fill="#fde047" font-family="monospace" font-size="10" font-weight="bold">WIND VECTOR: 225° SW (18 kts)</text>
  </g>

  <!-- Spill Release Point (T=0) -->
  <circle cx="160" cy="180" r="14" fill="#0284c7" opacity="0.5" />
  <circle cx="160" cy="180" r="6" fill="#38bdf8" />
  <text x="160" y="158" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">RELEASE POINT (T=0h)</text>

  <!-- Plume Horizon Envelopes (+12h, +24h, +48h, +72h) -->
  <!-- +12h Plume -->
  <ellipse cx="260" cy="220" rx="60" ry="35" fill="url(#plumeDispersion)" transform="rotate(15, 260, 220)" />
  <ellipse cx="260" cy="220" rx="60" ry="35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" transform="rotate(15, 260, 220)" />
  <text x="260" y="210" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">+12h (32 km²)</text>

  <!-- +36h Plume -->
  <ellipse cx="400" cy="270" rx="120" ry="65" fill="#0284c7" opacity="0.3" transform="rotate(15, 400, 270)" />
  <ellipse cx="400" cy="270" rx="120" ry="65" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" transform="rotate(15, 400, 270)" />
  <text x="400" y="255" fill="#60a5fa" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">+36h (128 km²)</text>

  <!-- +72h Coastal Impact Plume -->
  <ellipse cx="580" cy="330" rx="180" ry="90" fill="#dc2626" opacity="0.2" transform="rotate(15, 580, 330)" />
  <ellipse cx="580" cy="330" rx="180" ry="90" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6,4" transform="rotate(15, 580, 330)" />
  <text x="590" y="315" fill="#fde047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">+72h COASTAL IMPACT (310 km²)</text>

  <!-- Main Particle Drift Trajectory Vector (Gold Curved Line) -->
  <path d="M 160 180 C 280 230 420 280 640 365" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#windArrow)" />

  <!-- Particle Streamline Dots -->
  <g fill="#7dd3fc">
    <circle cx="210" cy="200" r="3" />
    <circle cx="310" cy="240" r="4" />
    <circle cx="360" cy="255" r="3" />
    <circle cx="460" cy="295" r="5" />
    <circle cx="510" cy="315" r="4" />
    <circle cx="560" cy="335" r="3" />
    <circle cx="610" cy="355" r="4" opacity="0.8" />
  </g>

  <!-- High Precision Reticle Target on Shoreline Point -->
  <g transform="translate(640, 365)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="0" cy="0" r="4" fill="#ef4444" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ef4444" stroke-width="1.5" />
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ef4444" stroke-width="1.5" />
  </g>
</svg>
