<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="deployBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02120b" />
      <stop offset="50%" stop-color="#052618" />
      <stop offset="100%" stop-color="#083824" />
    </linearGradient>

    <!-- Grid -->
    <pattern id="deployGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f452d" stroke-width="1" stroke-dasharray="2,2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#deployBg)" />
  <rect width="800" height="500" fill="url(#deployGrid)" opacity="0.6" />

  <!-- Containment Boom Barrier Lines (Vibrant Lime/Emerald Glowing Dashed Lines) -->
  <!-- Boom Barrier 1 -->
  <path d="M 280 160 L 460 220" fill="none" stroke="#22c55e" stroke-width="5" stroke-dasharray="8,4" />
  <circle cx="280" cy="160" r="7" fill="#4ade80" />
  <circle cx="460" cy="220" r="7" fill="#4ade80" />
  <text x="370" y="180" fill="#86efac" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BOOM BARRIER #1 (600m)</text>

  <!-- Boom Barrier 2 -->
  <path d="M 460 220 L 580 340" fill="none" stroke="#22c55e" stroke-width="5" stroke-dasharray="8,4" />
  <circle cx="580" cy="340" r="7" fill="#4ade80" />
  <text x="540" y="270" fill="#86efac" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BOOM BARRIER #2 (450m)</text>

  <!-- Oil Slick Boundary Being Contained -->
  <path d="M 240 120 Q 380 180 440 210 Q 520 280 480 330 Q 300 280 200 200 Z" fill="#065f46" opacity="0.4" stroke="#10b981" stroke-width="1.5" />
  <text x="320" y="220" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">TARGET SLICK CONTAINMENT ZONE</text>

  <!-- Skimmer Fleet Nodes & Dispatch Trajectories -->
  <!-- Skimmer Vessel 1 -->
  <g transform="translate(200, 280)">
    <polygon points="0,-12 10,10 -10,10" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="32" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SKIMMER ALPHA (250 m³/h)</text>
  </g>

  <!-- Skimmer Vessel 2 -->
  <g transform="translate(420, 140)">
    <polygon points="0,-12 10,10 -10,10" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="-18" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SKIMMER BRAVO (180 m³/h)</text>
  </g>

  <!-- Response Tug Dispatch Vessel -->
  <g transform="translate(560, 180)">
    <polygon points="0,-12 12,12 -12,12" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <text x="0" y="34" fill="#fde047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">RESPONSE TUG MARINER</text>
  </g>

  <!-- Route Dispatch Arrows -->
  <path d="M 100 400 L 190 295" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 680 80 L 575 165" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Base Logistics Port (Left Bottom) -->
  <rect x="20" y="380" width="160" height="90" rx="8" fill="#021c12" opacity="0.9" stroke="#10b981" stroke-width="1.5" />
  <text x="100" y="405" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MUMBAI STAGING PORT</text>
  <text x="100" y="425" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">Status: ACTIVE DISPATCH</text>
  <text x="100" y="445" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">ETA to Spill: 1h 40m</text>

  <!-- HUD Telemetry Text Cards -->
  <rect x="20" y="20" width="280" height="60" rx="6" fill="#021c12" opacity="0.95" stroke="#10b981" stroke-width="1.5" />
  <text x="35" y="42" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">MILP SOLVER OPTIMIZATION</text>
  <text x="35" y="62" fill="#a7f3d0" font-family="monospace" font-size="10">Target Recovery Rate: 78% (Optimized)</text>

  <rect x="500" y="420" width="280" height="60" rx="6" fill="#021c12" opacity="0.95" stroke="#10b981" stroke-width="1.5" />
  <text x="515" y="442" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">FLEET ALLOCATION STATUS</text>
  <text x="515" y="462" fill="#a7f3d0" font-family="monospace" font-size="10">3 Skimmers • 2 Booms • 1 Tug Dispatched</text>
</svg>
