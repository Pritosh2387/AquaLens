<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark SAR Radar Ocean Texture Background -->
    <linearGradient id="sarOceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020917" />
      <stop offset="40%" stop-color="#051936" />
      <stop offset="80%" stop-color="#092954" />
      <stop offset="100%" stop-color="#020815" />
    </linearGradient>

    <!-- UNet AI Slick Segmentation Gradient -->
    <radialGradient id="slickMaskGrad" cx="45%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020917" stop-opacity="0" />
    </radialGradient>

    <!-- Fine SAR Radar Noise Grid -->
    <pattern id="sarNoiseGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d4ed8" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.35"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="sarGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="800" height="500" fill="url(#sarOceanBg)" />
  <rect width="800" height="500" fill="url(#sarNoiseGrid)" />

  <!-- Latitude / Longitude Tactical Grid Markings -->
  <g fill="#64748b" font-family="monospace" font-size="9" opacity="0.7">
    <text x="15" y="100">18°59'N</text>
    <text x="15" y="240">18°56'N</text>
    <text x="15" y="380">18°53'N</text>

    <text x="160" y="490">72°46'E</text>
    <text x="360" y="490">72°50'E</text>
    <text x="560" y="490">72°54'E</text>
    <text x="720" y="490">72°58'E</text>
  </g>

  <!-- Bathymetric Sea Depth Iso-lines -->
  <g fill="none" stroke="#1e40af" stroke-width="1.5" opacity="0.4">
    <path d="M 0 110 C 250 170 550 100 800 130" />
    <path d="M 0 240 C 300 300 500 210 800 260" />
    <path d="M 0 380 C 280 430 520 350 800 400" />
  </g>
  <text x="720" y="105" fill="#3b82f6" font-family="monospace" font-size="9" opacity="0.6">-30m SAR Pass</text>
  <text x="720" y="235" fill="#3b82f6" font-family="monospace" font-size="9" opacity="0.6">Sigma-0: -24.2dB</text>

  <!-- UNet Oil Slick Segmentation Polygon Contour -->
  <path d="M 220 160 Q 380 130 540 200 Q 620 310 440 370 Q 260 360 180 250 Z" fill="url(#slickMaskGrad)" />
  <path d="M 220 160 Q 380 130 540 200 Q 620 310 440 370 Q 260 360 180 250 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#sarGlowFilter)" />

  <!-- UNet High-Confidence Core Slick Anomaly -->
  <path d="M 280 200 Q 380 170 480 230 Q 520 300 420 330 Q 300 320 250 250 Z" fill="#38bdf8" opacity="0.3" stroke="#4ade80" stroke-width="1.5" />
  <text x="360" y="250" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" filter="url(#sarGlowFilter)">UNET DETECTED SLICK (12.4 km²)</text>

  <!-- Radar Scanline Sweeping Line -->
  <line x1="0" y1="250" x2="800" y2="250" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />
  <text x="660" y="240" fill="#38bdf8" font-family="monospace" font-size="9" opacity="0.8">RADAR C-BAND SWATH</text>

  <!-- Target Reticle Crosshair at Oil Slick Center -->
  <g transform="translate(360, 250)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#sarGlowFilter)" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#38bdf8" stroke-width="1.5" />
    <text x="45" y="4" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="bold">TARGET 1: CONFIDENCE 91%</text>
  </g>
</svg>
