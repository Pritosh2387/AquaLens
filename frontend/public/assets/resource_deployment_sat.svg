<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Deep Oceanic Sapphire Gradient -->
    <linearGradient id="resourceOceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010e1a" />
      <stop offset="45%" stop-color="#04223d" />
      <stop offset="85%" stop-color="#083863" />
      <stop offset="100%" stop-color="#021021" />
    </linearGradient>

    <!-- Containment Sector Glowing Gradient -->
    <radialGradient id="emeraldSectorGrad" cx="42%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#010e1a" stop-opacity="0" />
    </radialGradient>

    <!-- Radar Fine Grid Pattern -->
    <pattern id="resourceReticleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.35"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="emeraldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Direction Arrow Marker -->
    <marker id="dispatchArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="tugArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="800" height="500" fill="url(#resourceOceanGrad)" />
  <rect width="800" height="500" fill="url(#resourceReticleGrid)" />

  <!-- Latitude / Longitude Tactical Grid Markings -->
  <g fill="#64748b" font-family="monospace" font-size="9" opacity="0.7">
    <text x="15" y="100">18°57'N</text>
    <text x="15" y="240">18°54'N</text>
    <text x="15" y="380">18°51'N</text>

    <text x="160" y="490">72°47'E</text>
    <text x="360" y="490">72°51'E</text>
    <text x="560" y="490">72°55'E</text>
    <text x="720" y="490">72°59'E</text>
  </g>

  <!-- Bathymetric Iso-Depth Lines & Soundings -->
  <g fill="none" stroke="#085266" stroke-width="1.5" opacity="0.5">
    <path d="M 0 100 Q 300 160 800 90" />
    <path d="M 0 250 Q 350 310 800 240" />
    <path d="M 0 400 Q 320 460 800 390" />
  </g>
  <text x="120" y="115" fill="#0284c7" font-family="monospace" font-size="9" opacity="0.6">-25m Depth</text>
  <text x="240" y="265" fill="#0284c7" font-family="monospace" font-size="9" opacity="0.6">-60m Depth</text>

  <!-- Concentric Sonar Pulse Rings -->
  <circle cx="400" cy="250" r="110" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5" />
  <circle cx="400" cy="250" r="210" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="6,4" opacity="0.35" />
  <circle cx="400" cy="250" r="310" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.2" />

  <!-- MILP Containment Sector Glow Polygon -->
  <path d="M 200 140 Q 400 110 580 170 Q 640 310 460 380 Q 260 370 180 260 Z" fill="url(#emeraldSectorGrad)" />
  <text x="380" y="260" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" filter="url(#emeraldGlowFilter)">SECTOR ALPHA CONTAINMENT (72% RECOVERY)</text>

  <!-- Containment Boom Barrier #1 (High-Sea Boom Lines with Buoys) -->
  <line x1="200" y1="140" x2="580" y2="170" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8,4" filter="url(#emeraldGlowFilter)" />
  <circle cx="280" cy="146" r="5" fill="#fbbf24" />
  <circle cx="380" cy="154" r="5" fill="#fbbf24" />
  <circle cx="480" cy="162" r="5" fill="#fbbf24" />
  <text x="390" y="135" fill="#fde047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CONTAINMENT BOOM BARRIER #1 (1200m)</text>

  <!-- Containment Boom Barrier #2 -->
  <line x1="580" y1="170" x2="460" y2="380" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8,4" filter="url(#emeraldGlowFilter)" />
  <circle cx="540" cy="240" r="5" fill="#fbbf24" />
  <circle cx="500" cy="310" r="5" fill="#fbbf24" />
  <text x="590" y="270" fill="#fde047" font-family="monospace" font-size="9" font-weight="bold">BOOM BARRIER #2 (850m)</text>

  <!-- Base Logistics Port (Staging Dock on Left Shoreline) -->
  <rect x="20" y="370" width="170" height="90" rx="6" fill="#021a12" opacity="0.9" stroke="#10b981" stroke-width="1.5" />
  <text x="105" y="395" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MUMBAI STAGING PORT</text>
  <text x="105" y="415" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">Active Fleet Transit</text>
  <text x="105" y="435" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">ETA to Sector: 1h 40m</text>

  <!-- Vessels / Skimmer Deployment Nodes -->
  <!-- Skimmer 1: Alpha -->
  <g transform="translate(200, 140)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="0" cy="0" r="10" fill="#0284c7" />
    <polygon points="0,-6 5,5 -5,5" fill="#ffffff" />
    <text x="0" y="-26" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">SKIMMER-01 (250 m³/h)</text>
  </g>
  <path d="M 105 400 C 140 300 170 200 195 145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#dispatchArrow)" />

  <!-- Skimmer 2: Bravo -->
  <g transform="translate(580, 170)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="0" cy="0" r="10" fill="#0284c7" />
    <polygon points="0,-6 5,5 -5,5" fill="#ffffff" />
    <text x="0" y="-26" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">SKIMMER-02 (180 m³/h)</text>
  </g>

  <!-- Heavy Response Tug Craft -->
  <g transform="translate(460, 380)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#fbbf24" stroke-width="2" filter="url(#emeraldGlowFilter)" />
    <circle cx="0" cy="0" r="12" fill="#d97706" />
    <polygon points="0,-7 7,7 -7,7" fill="#ffffff" />
    <text x="0" y="42" fill="#fde047" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">TUG MARINER DISPATCH</text>
  </g>
  <path d="M 190 415 L 430 385" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#tugArrow)" />
</svg>
