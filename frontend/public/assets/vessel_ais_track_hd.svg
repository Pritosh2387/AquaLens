<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark AIS Satellite Background -->
    <linearGradient id="aisOceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050817" />
      <stop offset="40%" stop-color="#0f1438" />
      <stop offset="80%" stop-color="#181a54" />
      <stop offset="100%" stop-color="#050715" />
    </linearGradient>

    <!-- Transponder Gap Sector Radial Gradient -->
    <radialGradient id="gapAnomalyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#6b21a8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050817" stop-opacity="0" />
    </radialGradient>

    <!-- Fine Grid Pattern -->
    <pattern id="aisReticleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.35"/>
    </pattern>

    <!-- Purple Glow Filter -->
    <filter id="purpleGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Direction Arrow Marker -->
    <marker id="shipArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="800" height="500" fill="url(#aisOceanBg)" />
  <rect width="800" height="500" fill="url(#aisReticleGrid)" />

  <!-- Latitude / Longitude Tactical Grid Markings -->
  <g fill="#64748b" font-family="monospace" font-size="9" opacity="0.7">
    <text x="15" y="100">18°57'N</text>
    <text x="15" y="240">18°54'N</text>
    <text x="15" y="380">18°51'N</text>

    <text x="160" y="490">72°45'E</text>
    <text x="360" y="490">72°49'E</text>
    <text x="560" y="490">72°53'E</text>
    <text x="720" y="490">72°57'E</text>
  </g>

  <!-- Bathymetric Iso-Depth Lines -->
  <g fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.4">
    <path d="M 0 110 C 250 170 550 100 800 130" />
    <path d="M 0 240 C 300 300 500 210 800 260" />
    <path d="M 0 380 C 280 430 520 350 800 400" />
  </g>

  <!-- AIS Transponder Track Points & Route Line -->
  <path d="M 120 100 L 240 180 L 360 260 L 520 360 L 680 420" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="8,4" filter="url(#purpleGlowFilter)" />

  <!-- AIS Gap Sector Highlights (Dark-Ship Anomaly Zone) -->
  <circle cx="360" cy="260" r="100" fill="url(#gapAnomalyGrad)" />
  <circle cx="360" cy="260" r="100" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="4,4" />
  <text x="360" y="225" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" filter="url(#purpleGlowFilter)">AIS TRANSPONDER GAP ANOMALY (2h 15m)</text>

  <!-- Target Suspect Vessel Icon (OCEAN PRIDE) -->
  <g transform="translate(360, 260)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#c084fc" stroke-width="2" filter="url(#purpleGlowFilter)" />
    <circle cx="0" cy="0" r="12" fill="#7e22ce" />
    <polygon points="0,-7 6,6 -6,6" fill="#ffffff" />
    <text x="0" y="42" fill="#e879f9" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">OCEAN PRIDE (MMSI 9234567)</text>
    <text x="0" y="56" fill="#c084fc" font-family="monospace" font-size="9" text-anchor="middle">Attribution Score: 0.91 (Highest)</text>
  </g>

  <!-- Vessel Course Over Ground (COG) & Speed Vector Arrow -->
  <line x1="360" y1="260" x2="480" y2="335" stroke="#e879f9" stroke-width="2.5" marker-end="url(#shipArrow)" />
  <text x="440" y="285" fill="#c084fc" font-family="monospace" font-size="9" font-weight="bold">COG: 195° SE | SOG: 14.2 kts</text>

  <!-- Secondary Candidate Vessel Positions (Lower Likelihood Scores) -->
  <g transform="translate(180, 320)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#94a3b8" />
    <text x="0" y="22" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Tanker Mariner (0.24)</text>
  </g>

  <g transform="translate(580, 160)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#94a3b8" />
    <text x="0" y="22" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Cargo Express (0.12)</text>
  </g>

  <!-- High Precision Reticle Targeting Crosshair -->
  <g transform="translate(360, 260)">
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#e879f9" stroke-width="1" />
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#e879f9" stroke-width="1" />
  </g>
</svg>
