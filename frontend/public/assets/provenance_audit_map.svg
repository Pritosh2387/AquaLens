    <text x="0" y="-15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">BLOCK #10493</text>
    <text x="0" y="5" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">UNet Slick Mask</text>
    <text x="0" y="22" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">Hash: 0x4b19...e802</text>
  </g>

  <line x1="390" y1="220" x2="470" y2="220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />

