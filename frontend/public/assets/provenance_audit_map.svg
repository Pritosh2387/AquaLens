    <text x="0" y="22" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">Hash: 0x7c91...f24a</text>
  </g>

  <line x1="610" y1="220" x2="690" y2="220" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" />

