    <text x="0" y="22" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">Hash: 0x8f2a...391c</text>
  </g>

  <line x1="170" y1="220" x2="250" y2="220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Block #10493 -->
  <g transform="translate(320, 220)">
