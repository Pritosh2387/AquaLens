# in development mode only. Docker support is not yet active.
# Do NOT use this in production without proper configuration.
#
# Usage (when ready):
#   docker compose up --build
#   docker compose down
# ============================================================

version: "3.9"

services:

  # ── Backend — FastAPI (Module 1-17 pipeline) ──────────────
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: aqualens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Override CORS origins if needed
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://frontend
    volumes:
      # Mount data directory so generated mock data persists across restarts
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aqualens-net

  # ── Frontend — React + Vite (served via Nginx) ─────────────
  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        # Points the frontend at the backend container
        VITE_API_BASE_URL: http://localhost:8000
    container_name: aqualens-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aqualens-net

# ── Named volumes ─────────────────────────────────────────────
volumes:
  backend-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────
networks:
  aqualens-net:
    driver: bridge
